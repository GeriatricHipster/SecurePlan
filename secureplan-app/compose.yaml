services:
  secureplan:
    build: .
    ports:
      - "3000:3000"
    environment:
      NODE_ENV: production
      SETUP_CODE: "${SETUP_CODE:?Set SETUP_CODE before starting SecurePlan}"
      DATA_DIR: /var/data
      APP_ORIGIN: "http://localhost:3000"
      MOBILE_ORIGINS: "${MOBILE_ORIGINS:-}"
      TRUST_PROXY: "false"
      COOKIE_SECURE: "false"
      MIN_FREE_STORAGE_BYTES: "1048576"
    volumes:
      - secureplan-data:/var/data
    restart: unless-stopped

volumes:
  secureplan-data:
